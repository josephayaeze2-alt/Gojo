
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jujutsu Kaisen - Domain Expansion</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#03030b;color:white;
 font-family:Arial,sans-serif;overflow:hidden
}
.page{
 position:absolute;inset:0;display:none;
 align-items:center;justify-content:center;
 flex-direction:column;text-align:center;overflow:hidden
}
.page.active{display:flex}
button{
 border:1px solid #80caff;background:#101d39;color:white;
 padding:13px 22px;border-radius:8px;font-size:16px;cursor:pointer
}
button:hover{filter:brightness(1.5)}
h1{
 font-size:clamp(35px,8vw,70px);
 letter-spacing:5px;text-shadow:0 0 25px #64baff
}
#menu{background:radial-gradient(circle,#142c55,#050610 65%)}
.characters{
 display:grid;grid-template-columns:repeat(2,minmax(130px,190px));
 gap:12px;margin:20px
}
.character{
 padding:22px 10px;border:1px solid #4c8ecb;
 border-radius:10px;background:#101b31
}
.character small{display:block;margin-top:8px;color:#9bb9df}
.offline{opacity:.35}
#cameraPage{background:#050914}
#camera{
 width:min(90vw,520px);border:2px solid #65baff;
 border-radius:12px;transform:scaleX(-1)
}
#status{color:#a8d9ff;margin:15px}
#domain{
 background:#02020a;opacity:0;pointer-events:none;
 transition:opacity .5s
}
#domain.active{opacity:1;pointer-events:auto}
#universe{
 position:absolute;inset:-20%;
 background:radial-gradient(ellipse at 50% 50%,#e6f8ff 0%,#799dff 2%,#222b80 9%,#090b29 30%,#02020b 68%);
 transform:scale(.1);
 animation:universeOpen 5s cubic-bezier(.12,.75,.18,1) forwards
}
@keyframes universeOpen{
 0%{transform:scale(.1);filter:brightness(5)}
 20%{transform:scale(.55);filter:brightness(3)}
 55%{transform:scale(1.15);filter:brightness(1.5)}
 100%{transform:scale(1);filter:brightness(1)}
}
#stars,#stars2,#stars3{
 position:absolute;inset:-50%;
 background-image:
 radial-gradient(2px 2px at 10% 20%,white 99%,transparent),
 radial-gradient(1px 1px at 30% 70%,white 99%,transparent),
 radial-gradient(2px 2px at 80% 40%,#bceaff 99%,transparent),
 radial-gradient(1px 1px at 60% 15%,white 99%,transparent),
 radial-gradient(2px 2px at 90% 85%,white 99%,transparent);
 background-size:230px 230px;
 animation:starMove 35s linear infinite
}
#stars2{background-size:160px 160px;opacity:.65;animation-duration:22s}
#stars3{background-size:310px 310px;opacity:.5;animation-duration:50s}
@keyframes starMove{to{transform:rotate(360deg) scale(1.2)}}
#galaxy{
 position:absolute;width:140vmax;height:140vmax;border-radius:50%;
 left:50%;top:50%;transform:translate(-50%,-50%);
 background:repeating-radial-gradient(ellipse,transparent 0 22px,rgba(151,199,255,.12) 24px 26px,transparent 28px 48px);
 box-shadow:inset 0 0 100px #718fff,0 0 100px #354fbd;
 animation:galaxySpin 80s linear infinite
}
@keyframes galaxySpin{to{rotate:360deg}}
#energy{
 position:absolute;inset:0;pointer-events:none;
 background:conic-gradient(from 0deg at 50% 50%,transparent,#9ddcff55,transparent,#8b9aff66,transparent,#fff8,transparent);
 opacity:0;animation:energy 3s ease-out forwards
}
@keyframes energy{
 0%{opacity:0;transform:scale(.1)}
 30%{opacity:1;transform:scale(.5) rotate(120deg)}
 70%{opacity:.6;transform:scale(1.5) rotate(240deg)}
 100%{opacity:.1;transform:scale(2) rotate(360deg)}
}
#flash{
 position:absolute;inset:0;background:white;opacity:0;
 pointer-events:none;animation:flash .9s ease-out forwards
}
@keyframes flash{0%,100%{opacity:0}20%{opacity:1}45%{opacity:.85}}
#ring{
 position:absolute;width:15vmin;height:15vmin;
 border:3px solid #e6f8ff;border-radius:50%;
 left:50%;top:50%;transform:translate(-50%,-50%);
 box-shadow:0 0 30px #9bdfff,0 0 80px #477aff;
 animation:ring 3s ease-out forwards
}
@keyframes ring{to{width:180vmax;height:180vmax;opacity:0}}
#domainTitle{
 position:relative;z-index:5;
 font-size:clamp(38px,9vw,100px);letter-spacing:8px;
 color:#f2f8ff;
 text-shadow:0 0 15px #fff,0 0 40px #70baff,0 0 90px #456dff;
 opacity:0;animation:titleIn 2s 2s forwards
}
#subtitle{
 position:relative;z-index:5;color:#b9d9ff;
 letter-spacing:5px;opacity:0;animation:titleIn 2s 3s forwards
}
@keyframes titleIn{
 from{opacity:0;transform:scale(1.5);filter:blur(15px)}
 to{opacity:1;transform:scale(1);filter:blur(0)}
}
#close{position:absolute;z-index:10;bottom:25px}

/* SUKUNA'S MALEVOLENT SHRINE */
#domain.sukuna{background:#100303}
#domain.sukuna #universe{
 background:radial-gradient(ellipse at center,#641313 0%,#280707 35%,#080202 75%)
}
#domain.sukuna #galaxy{
 background:repeating-radial-gradient(circle,transparent 0 35px,#a92323 37px 40px,transparent 43px 65px);
 box-shadow:inset 0 0 100px #8d1010,0 0 100px #a41414
}
#domain.sukuna #stars{opacity:.3}
#domain.sukuna #stars2{opacity:.2}
#domain.sukuna #stars3{opacity:.2}
#domain.sukuna #energy{
 background:conic-gradient(transparent,#ff272766,transparent,#a00000aa,transparent,#ff7777aa,transparent)
}
#domain.sukuna #ring{border-color:#ff5555;box-shadow:0 0 35px red,0 0 100px #b00000}
#domain.sukuna #domainTitle{
 color:#ffdddd;text-shadow:0 0 15px white,0 0 40px red,0 0 90px #a00000
}
#domain.sukuna #subtitle{color:#ff9b9b}
#shrine{
 display:none;position:absolute;z-index:3;top:50%;left:50%;
 transform:translate(-50%,-50%) scale(.4);
 font-size:clamp(90px,25vw,240px);
 filter:drop-shadow(0 0 25px red);opacity:0
}
#domain.sukuna #shrine{display:block;animation:shrineAppear 3s 1s forwards}
@keyframes shrineAppear{
 0%{opacity:0;transform:translate(-50%,-40%) scale(.4)}
 60%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
 100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
.slash{
 position:absolute;z-index:2;left:50%;top:50%;width:3px;height:120vh;
 background:linear-gradient(transparent,#ff3333,white,#ff3333,transparent);
 box-shadow:0 0 18px red;opacity:0;transform:rotate(45deg)
}
#domain.sukuna .slash{animation:slash 1.2s ease-out infinite}
#domain.sukuna .slash:nth-child(2){animation-delay:.2s;transform:rotate(-35deg)}
#domain.sukuna .slash:nth-child(3){animation-delay:.5s;transform:rotate(75deg)}
#domain.sukuna .slash:nth-child(4){animation-delay:.8s;transform:rotate(-70deg)}
@keyframes slash{
 0%{opacity:0;scale:.2}
 30%{opacity:1}
 100%{opacity:0;scale:1.5}
}

/* MAHITO'S SELF-EMBODIMENT OF PERFECTION */
#domain.mahito{
 background:radial-gradient(circle,#153e43 0%,#091c25 45%,#02070d 100%)
}
#domain.mahito #universe{
 background:
 radial-gradient(ellipse at center,#b5fff0 0%,#378e85 3%,#174c59 18%,#102332 45%,#02070d 75%);
 animation:mahitoUniverse 5s cubic-bezier(.12,.75,.18,1) forwards
}
@keyframes mahitoUniverse{
 0%{transform:scale(.05) rotate(-30deg);filter:brightness(5) hue-rotate(50deg)}
 35%{transform:scale(.7) rotate(15deg);filter:brightness(2)}
 70%{transform:scale(1.2) rotate(-8deg)}
 100%{transform:scale(1) rotate(0);filter:brightness(1)}
}
#domain.mahito #galaxy{
 background:repeating-radial-gradient(ellipse,transparent 0 18px,#6bdbcc55 20px 23px,transparent 25px 43px);
 box-shadow:inset 0 0 100px #36b8a0,0 0 100px #1b948d;
 animation:mahitoGalaxy 18s linear infinite
}
@keyframes mahitoGalaxy{
 from{transform:translate(-50%,-50%) rotate(0) scale(.7)}
 to{transform:translate(-50%,-50%) rotate(360deg) scale(1.15)}
}
#domain.mahito #stars{
 opacity:.8;
 background-image:
 radial-gradient(3px 3px at 10% 20%,#cffff5 99%,transparent),
 radial-gradient(2px 2px at 30% 70%,#6affdd 99%,transparent),
 radial-gradient(3px 3px at 80% 40%,#fff 99%,transparent),
 radial-gradient(2px 2px at 60% 15%,#9ffff0 99%,transparent)
}
#domain.mahito #stars2{opacity:.55}
#domain.mahito #stars3{opacity:.35}
#domain.mahito #energy{
 background:conic-gradient(transparent,#4dffe477,transparent,#a5fff988,transparent,#1aa99eaa,transparent);
 animation:mahitoEnergy 2.5s ease-out forwards
}
@keyframes mahitoEnergy{
 0%{opacity:0;transform:scale(.1) rotate(0)}
 35%{opacity:1;transform:scale(.8) rotate(150deg)}
 70%{opacity:.8;transform:scale(1.5) rotate(270deg)}
 100%{opacity:.15;transform:scale(2.2) rotate(360deg)}
}
#domain.mahito #ring{
 border-color:#9effe6;
 box-shadow:0 0 35px #4effd5,0 0 100px #00a99b;
 animation:mahitoRing 3s ease-out forwards
}
@keyframes mahitoRing{
 0%{width:5vmin;height:5vmin;opacity:1}
 100%{width:180vmax;height:180vmax;opacity:0}
}
#domain.mahito #domainTitle{
 color:#d8fff6;
 text-shadow:0 0 15px white,0 0 40px #40eacb,0 0 90px #087d83;
 animation:mahitoTitle 2s 2s forwards
}
#domain.mahito #subtitle{
 color:#9dffea;letter-spacing:7px
}
@keyframes mahitoTitle{
 0%{opacity:0;transform:scale(2.5) rotate(-4deg);filter:blur(25px)}
 55%{opacity:1;transform:scale(.9) rotate(2deg);filter:blur(0)}
 75%{transform:scale(1.08) rotate(-1deg)}
 100%{opacity:1;transform:scale(1);filter:blur(0)}
}

/* MAHITO'S SOUL HANDS */
#soulHands{
 display:none;position:absolute;inset:0;z-index:4;
 pointer-events:none
}
#domain.mahito #soulHands{display:block}
.soulHand{
 position:absolute;top:50%;
 font-size:clamp(75px,18vw,170px);
 filter:drop-shadow(0 0 22px #43f5d0);
 opacity:0
}
#leftHand{
 left:-25%;transform:translateY(-50%) rotate(-45deg);
 animation:leftHandIn 2s .5s forwards,soulFloat 4s 2.5s ease-in-out infinite
}
#rightHand{
 right:-25%;transform:translateY(-50%) rotate(45deg) scaleX(-1);
 animation:rightHandIn 2s .7s forwards,soulFloat 4s 2.7s ease-in-out infinite
}
@keyframes leftHandIn{
 0%{left:-30%;opacity:0}
 70%{left:5%;opacity:1}
 100%{left:2%;opacity:.85}
}
@keyframes rightHandIn{
 0%{right:-30%;opacity:0}
 70%{right:5%;opacity:1}
 100%{right:2%;opacity:.85}
}
@keyframes soulFloat{
 0%,100%{translate:0 0;rotate:0deg}
 50%{translate:0 -22px;rotate:8deg}
}
#soulPulse{
 display:none;position:absolute;z-index:2;
 width:20vmin;height:20vmin;border-radius:50%;
 left:50%;top:50%;transform:translate(-50%,-50%);
 border:5px solid #70ffe2;
 box-shadow:0 0 35px #32f5cb,inset 0 0 35px #32f5cb;
 pointer-events:none
}
#domain.mahito #soulPulse{
 display:block;animation:soulPulse 2.5s .7s ease-out infinite
}
@keyframes soulPulse{
 0%{width:10vmin;height:10vmin;opacity:0;filter:blur(8px)}
 25%{opacity:1}
 100%{width:110vmax;height:110vmax;opacity:0;filter:blur(2px)}
}

/* HAKARI'S IDLE DEATH GAMBLE */
#hakariPage{
 background:#fff;color:#171717;
 font-family:Arial,sans-serif;
}
#hakariPage h1{
 color:#171717;text-shadow:0 0 15px #aaa;
 font-size:clamp(30px,7vw,65px);
 letter-spacing:3px;margin:10px
}
#hakariPage p{color:#333}
#slotMachine{
 display:flex;gap:10px;justify-content:center;
 align-items:center;padding:20px;
 background:linear-gradient(145deg,#eee,#bbb);
 border:7px solid #777;border-radius:22px;
 box-shadow:0 0 25px #999,inset 0 0 15px #fff;
}
.reel{
 width:clamp(75px,20vw,120px);
 height:clamp(95px,24vw,140px);
 display:flex;align-items:center;justify-content:center;
 background:white;border:4px solid #555;border-radius:12px;
 font-size:clamp(48px,12vw,75px);font-weight:bold;
 color:#222;box-shadow:inset 0 0 15px #aaa;
}
.reel.spinning{animation:reelShake .12s linear infinite}
@keyframes reelShake{
 0%{transform:translateY(-3px)}
 50%{transform:translateY(3px)}
 100%{transform:translateY(-3px)}
}
#hakariStatus{
 min-height:35px;font-size:20px;font-weight:bold;
 color:#222;margin:12px
}
#jackpotTimer{
 font-size:clamp(30px,8vw,55px);font-weight:bold;
 color:#d49b00;display:none;
 text-shadow:0 0 12px #ffd700
}
#hakariPage.jackpot{
 background:radial-gradient(circle,#fff,#ffe77a 45%,#fff 80%);
 animation:jackpotPulse 1s ease-in-out infinite alternate
}
@keyframes jackpotPulse{
 from{filter:brightness(1)}
 to{filter:brightness(1.2)}
}
#hakariPage.jackpot #slotMachine{
 border-color:#e2b400;
 box-shadow:0 0 30px #ffcf00,0 0 80px #ffdc48
}
#hakariPage.jackpot .reel{
 color:#d49b00;border-color:#e2b400;
 box-shadow:inset 0 0 20px #ffe77a,0 0 15px #ffd700
}
#jackpotText{
 display:none;font-size:clamp(35px,9vw,75px);
 font-weight:1000;color:#e0a900;
 text-shadow:0 0 10px white,0 0 30px gold;
 animation:jackpotText 1s ease-in-out infinite alternate
}
@keyframes jackpotText{
 from{transform:scale(1)}
 to{transform:scale(1.12)}
}
#hakariClose{margin-top:15px}
#spinButton{margin:10px;background:#222;color:white;border-color:#d5a900}
</style>
</head>

<body>

<section id="menu" class="page active">
 <h1>DOMAIN EXPANSION</h1>
 <p>Choose your sorcerer</p>
 <div class="characters">
  <button class="character" onclick="openCharacter('gojo')">
   GOJO<small>INFINITE VOID</small>
  </button>
  <button class="character" onclick="openCharacter('sukuna')">
   SUKUNA<small>MALEVOLENT SHRINE</small>
  </button>
  <button class="character" onclick="openCharacter('hakari')">
   HAKARI<small>IDLE DEATH GAMBLE</small>
  </button>
  <button class="character" onclick="openCharacter('mahito')">
   MAHITO<small>SELF-EMBODIMENT OF PERFECTION</small>
  </button>
  <div class="character offline">MEGUMI<small>COMING SOON</small></div>
 </div>
</section>

<section id="cameraPage" class="page">
 <h1 id="characterName">GOJO SATORU</h1>
 <p id="instructions">Show your hand to activate the domain</p>
 <video id="camera" autoplay playsinline></video>
 <p id="status">Starting camera...</p>
 <button onclick="backToMenu()">BACK</button>
</section>

<section id="domain" class="page">
 <div id="universe"></div>
 <div id="galaxy"></div>
 <div id="stars"></div>
 <div id="stars2"></div>
 <div id="stars3"></div>
 <div id="energy"></div>
 <div id="ring"></div>
 <div id="flash"></div>

 <div class="slash"></div>
 <div class="slash"></div>
 <div class="slash"></div>
 <div class="slash"></div>

 <div id="shrine">⛩️</div>

 <div id="soulPulse"></div>
 <div id="soulHands">
  <div class="soulHand" id="leftHand">🖐️</div>
  <div class="soulHand" id="rightHand">🖐️</div>
 </div>

 <div>
  <div id="domainTitle">INFINITE VOID</div>
  <div id="subtitle">DOMAIN EXPANSION</div>
 </div>
 <button id="close" onclick="closeDomain()">CLOSE DOMAIN</button>
</section>

<section id="hakariPage" class="page">
 <h1>IDLE DEATH GAMBLE</h1>
 <p>Make Gojo's hand pose to spin the reels!</p>

 <div id="slotMachine">
  <div class="reel" id="reel1">?</div>
  <div class="reel" id="reel2">?</div>
  <div class="reel" id="reel3">?</div>
 </div>

 <div id="hakariStatus">Waiting for your hand sign...</div>
 <div id="jackpotText">JACKPOT!!!</div>
 <div id="jackpotTimer">4:11</div>

 <button id="spinButton" onclick="spinSlots()">SPIN AGAIN</button>
 <button id="hakariClose" onclick="closeHakari()">BACK TO CAMERA</button>
</section>

<script>
const menu=document.getElementById("menu");
const cameraPage=document.getElementById("cameraPage");
const domain=document.getElementById("domain");
const hakariPage=document.getElementById("hakariPage");
const video=document.getElementById("camera");
const statusText=document.getElementById("status");

let camera=null;
let hands=null;
let domainActive=false;
let selectedCharacter="gojo";
let lastActivation=0;
let jackpotInterval=null;
let spinInProgress=false;

/* PAGE MANAGEMENT */
function showPage(page){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 page.classList.add("active");
}

/* CHARACTER SELECTION */
async function openCharacter(character){
 selectedCharacter=character;

 const names={
  gojo:"GOJO SATORU",
  sukuna:"RYOMEN SUKUNA",
  hakari:"KINJI HAKARI",
  mahito:"MAHITO"
 };

 const instructions={
  gojo:"Make Gojo's hand pose to activate Infinite Void",
  sukuna:"Use Gojo's pose or bring both hands together for Malevolent Shrine",
  hakari:"Make Gojo's hand pose to spin Hakari's slot machine!",
  mahito:"Make Gojo's hand pose to activate Self-Embodiment of Perfection"
 };

 document.getElementById("characterName").textContent=names[character];
 document.getElementById("instructions").textContent=instructions[character];

 showPage(cameraPage);
 statusText.textContent="Requesting camera permission...";

 try{
  if(camera){
   camera.stop();
   camera=null;
  }
  if(video.srcObject){
   video.srcObject.getTracks().forEach(t=>t.stop());
   video.srcObject=null;
  }

  hands=new Hands({
   locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
   maxNumHands:2,
   modelComplexity:1,
   minDetectionConfidence:.7,
   minTrackingConfidence:.7
  });

  hands.onResults(onHandResults);

  camera=new Camera(video,{
   onFrame:async()=>{
    if(hands)await hands.send({image:video});
   },
   width:640,
   height:480
  });

  await camera.start();
  statusText.textContent="Camera ready. Make your domain gesture!";

 }catch(error){
  statusText.textContent="Camera error. Allow camera access and use HTTPS.";
  console.error(error);
 }
}

/* BASIC GOJO-STYLE POSE DETECTOR */
function isGojoPose(l){
 return l[8].y<l[6].y &&
 l[12].y>l[10].y &&
 l[16].y>l[14].y &&
 l[20].y>l[18].y;
}

/* APPROXIMATION OF SUKUNA'S TWO-HAND SIGN */
function isSukunaPose(allHands){
 if(!allHands||allHands.length<2)return false;
 const a=allHands[0][0];
 const b=allHands[1][0];
 const distance=Math.hypot(a.x-b.x,a.y-b.y);
 return distance<0.28;
}

/* CAMERA HAND DETECTION */
function onHandResults(results){
 if(domainActive)return;

 const all=results.multiHandLandmarks||[];
 const gojoPose=all.some(isGojoPose);
 const sukunaPose=isSukunaPose(all);

 if(selectedCharacter==="gojo"&&gojoPose){
  statusText.textContent="INFINITE VOID!";
  activateDomain();
 }
 else if(selectedCharacter==="sukuna"&&(gojoPose||sukunaPose)){
  statusText.textContent="MALEVOLENT SHRINE!";
  activateDomain();
 }
 else if(selectedCharacter==="hakari"&&gojoPose){
  statusText.textContent="IDLE DEATH GAMBLE!";
  startHakari();
 }
 else if(selectedCharacter==="mahito"&&gojoPose){
  statusText.textContent="SELF-EMBODIMENT OF PERFECTION!";
  activateDomain();
 }
 else{
  statusText.textContent=all.length?
   "Hand detected. Make your domain gesture.":
   "Show your hand to the camera.";
 }
}

/* GOJO, SUKUNA AND MAHITO DOMAINS */
function activateDomain(){
 if(domainActive||Date.now()-lastActivation<3500)return;

 lastActivation=Date.now();
 domainActive=true;

 domain.classList.remove("sukuna","mahito");

 if(selectedCharacter==="sukuna"){
  domain.classList.add("sukuna");
 }
 if(selectedCharacter==="mahito"){
  domain.classList.add("mahito");
 }

 const titles={
  gojo:"INFINITE VOID",
  sukuna:"MALEVOLENT SHRINE",
  mahito:"SELF-EMBODIMENT OF PERFECTION"
 };

 const subtitles={
  gojo:"DOMAIN EXPANSION",
  sukuna:"RYOMEN SUKUNA",
  mahito:"DOMAIN EXPANSION"
 };

 document.getElementById("domainTitle").textContent=titles[selectedCharacter];
 document.getElementById("subtitle").textContent=subtitles[selectedCharacter];

 showPage(domain);

 [
  "universe","stars","stars2","stars3","galaxy",
  "energy","ring","flash","domainTitle","subtitle",
  "shrine","leftHand","rightHand","soulPulse"
 ].forEach(id=>{
  const el=document.getElementById(id);
  el.style.animation="none";
  void el.offsetWidth;
  el.style.animation="";
 });
}

function closeDomain(){
 domainActive=false;
 domain.classList.remove("sukuna","mahito");
 showPage(cameraPage);
}

/* HAKARI: IDLE DEATH GAMBLE */
function startHakari(){
 if(domainActive||spinInProgress||Date.now()-lastActivation<1500)return;

 lastActivation=Date.now();
 domainActive=true;

 hakariPage.classList.remove("jackpot");
 document.getElementById("jackpotText").style.display="none";
 document.getElementById("jackpotTimer").style.display="none";
 document.getElementById("hakariStatus").textContent="ROLLING...";
 showPage(hakariPage);
 spinSlots();
}

function spinSlots(){
 if(spinInProgress)return;

 spinInProgress=true;
 domainActive=true;

 clearInterval(jackpotInterval);
 jackpotInterval=null;

 hakariPage.classList.remove("jackpot");
 document.getElementById("jackpotText").style.display="none";
 document.getElementById("jackpotTimer").style.display="none";
 document.getElementById("hakariStatus").textContent="SPINNING...";

 const reels=[
  document.getElementById("reel1"),
  document.getElementById("reel2"),
  document.getElementById("reel3")
 ];

 reels.forEach(reel=>{
  reel.classList.add("spinning");
 });

 const results=[
  Math.floor(Math.random()*7)+1,
  Math.floor(Math.random()*7)+1,
  Math.floor(Math.random()*7)+1
 ];

 let ticks=0;
 const animation=setInterval(()=>{
  reels.forEach(reel=>{
   reel.textContent=Math.floor(Math.random()*7)+1;
  });
  ticks++;

  if(ticks>=15){
   clearInterval(animation);

   reels.forEach((reel,index)=>{
    reel.classList.remove("spinning");
    reel.textContent=results[index];
   });

   finishSpin(results);
  }
 },120);
}

function finishSpin(results){
 spinInProgress=false;

 if(results[0]===7&&results[1]===7&&results[2]===7){
  activateJackpot();
 }else{
  document.getElementById("hakariStatus").textContent=
   "NO JACKPOT! TRY AGAIN!";
 }
}

function activateJackpot(){
 hakariPage.classList.add("jackpot");

 document.getElementById("hakariStatus").textContent=
  "THE ODDS ARE IN YOUR FAVOR!";

 document.getElementById("jackpotText").style.display="block";

 const timer=document.getElementById("jackpotTimer");
 timer.style.display="block";

 let seconds=251;
 updateTimer(seconds);

 jackpotInterval=setInterval(()=>{
  seconds--;
  updateTimer(seconds);

  if(seconds<=0){
   clearInterval(jackpotInterval);
   jackpotInterval=null;
   hakariPage.classList.remove("jackpot");
   document.getElementById("jackpotText").style.display="none";
   timer.style.display="none";
   document.getElementById("hakariStatus").textContent=
    "JACKPOT TIME IS OVER!";
  }
 },1000);
}

function updateTimer(seconds){
 const minutes=Math.floor(seconds/60);
 const remaining=seconds%60;

 document.getElementById("jackpotTimer").textContent=
  minutes+":"+String(remaining).padStart(2,"0");
}

function closeHakari(){
 clearInterval(jackpotInterval);
 jackpotInterval=null;
 spinInProgress=false;
 domainActive=false;
 hakariPage.classList.remove("jackpot");
 showPage(cameraPage);
}

/* RETURN TO CHARACTER MENU */
function backToMenu(){
 domainActive=false;
 spinInProgress=false;

 clearInterval(jackpotInterval);
 jackpotInterval=null;

 if(camera){
  camera.stop();
  camera=null;
 }

 if(video.srcObject){
  video.srcObject.getTracks().forEach(t=>t.stop());
  video.srcObject=null;
 }

 if(hands){
  hands.close();
  hands=null;
 }

 domain.classList.remove("sukuna","mahito");
 hakariPage.classList.remove("jackpot");
 showPage(menu);
}
</script>
