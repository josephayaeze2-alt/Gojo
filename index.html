
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain Expansion Selector</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #050510;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

button {
  padding: 14px 20px;
  margin: 8px;
  border: 1px solid #777;
  border-radius: 12px;
  background: #17172b;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

#menu {
  padding: 32px 14px;
}

h1 {
  letter-spacing: 3px;
}

.domain {
  display: block;
  width: min(92%, 460px);
  margin: 12px auto;
}

.online {
  border-color: #78aaff;
  background: #172554;
}

#message {
  min-height: 26px;
  color: #ff9b9b;
}

#gojoPage {
  display: none;
  padding: 22px 12px;
}

#camera {
  display: block;
  width: min(92%, 460px);
  margin: 16px auto;
  border-radius: 16px;
  background: #111;
  transform: scaleX(-1);
}

#status {
  min-height: 26px;
  color: #a9ceff;
}

/* INFINITE VOID */

#void {
  display: none;
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 5;
  background: #03010c;
}

#universe {
  position: absolute;
  inset: 0;
  opacity: 0;
  background:
    radial-gradient(
      ellipse at center,
      #eee7ff 0%,
      #aaa0ff 9%,
      #6552c5 25%,
      #26145e 55%,
      #02010b 100%
    );
}

#stars {
  position: absolute;
  inset: -100%;
  background-image:
    radial-gradient(2px 2px at 20% 30%, white 90%, transparent),
    radial-gradient(2px 2px at 70% 60%, white 90%, transparent),
    radial-gradient(3px 3px at 45% 80%, #d5caff 90%, transparent),
    radial-gradient(2px 2px at 85% 15%, white 90%, transparent);
  background-size: 160px 160px;
}

/* ENERGY LINES */

#energy {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
}

.streak {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 3px;
  height: 75vh;
  margin-left: -1.5px;
  margin-top: -37.5vh;
  transform-origin: center;
  background: linear-gradient(
    to bottom,
    transparent,
    #8a42ff,
    #e4caff,
    white,
    #9c55ff,
    transparent
  );
  box-shadow:
    0 0 10px #a45aff,
    0 0 25px #8c40ff;
}

.streak:nth-child(1) { transform: rotate(0deg); }
.streak:nth-child(2) { transform: rotate(30deg); }
.streak:nth-child(3) { transform: rotate(60deg); }
.streak:nth-child(4) { transform: rotate(90deg); }
.streak:nth-child(5) { transform: rotate(120deg); }
.streak:nth-child(6) { transform: rotate(150deg); }
.streak:nth-child(7) { transform: rotate(180deg); }
.streak:nth-child(8) { transform: rotate(210deg); }
.streak:nth-child(9) { transform: rotate(240deg); }
.streak:nth-child(10) { transform: rotate(270deg); }
.streak:nth-child(11) { transform: rotate(300deg); }
.streak:nth-child(12) { transform: rotate(330deg); }

/* CENTRAL BURST */

#burst {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: white;
  transform: translate(-50%, -50%) scale(0);
  box-shadow:
    0 0 30px 15px #b58aff,
    0 0 90px 45px #783cff;
  opacity: 0;
}

/* EXPANDING RING */

#ring {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 40px;
  height: 40px;
  border: 5px solid #e5caff;
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0);
  box-shadow:
    0 0 20px #b45aff,
    0 0 50px #8c40ff,
    inset 0 0 20px #b45aff;
  opacity: 0;
}

#flash {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
}

#voidTitle {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 100%;
  transform: translate(-50%, -50%) scale(.7);
  opacity: 0;
  z-index: 3;
  font-size: clamp(30px, 7vw, 65px);
  letter-spacing: 4px;
  text-shadow:
    0 0 15px #d6baff,
    0 0 35px #a65aff,
    0 0 70px #7540ff;
}

#close {
  position: absolute;
  z-index: 5;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  background: #17122f;
}

/* DOMAIN ANIMATION */

#void.playing #energy {
  animation: energyAppear 2s ease forwards;
}

#void.playing .streak {
  animation: streakPull 1.5s cubic-bezier(.2,.7,.3,1) forwards;
}

#void.playing #burst {
  animation: burstAppear 1.5s ease-out forwards;
}

#void.playing #ring {
  animation: ringExpand 2s ease-out forwards;
}

#void.playing #flash {
  animation: flashEffect 1.5s ease-out forwards;
}

#void.playing #universe {
  animation: universeAppear 2.5s ease forwards;
}

#void.playing #stars {
  animation: starDrift 15s linear infinite;
}

#void.playing #voidTitle {
  animation: titleAppear 1.5s 1.8s ease forwards;
}

@keyframes energyAppear {
  0% { opacity: 0; }
  20%, 70% { opacity: 1; }
  100% { opacity: 0; }
}

@keyframes streakPull {
  0% {
    opacity: 0;
    scale: 1;
  }
  20% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    scale: .08;
  }
}

@keyframes burstAppear {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0);
  }
  35% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(2);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(8);
  }
}

@keyframes ringExpand {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0);
  }
  30% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(35);
  }
}

@keyframes flashEffect {
  0%, 30% { opacity: 0; }
  42% { opacity: .95; }
  55% { opacity: .15; }
  100% { opacity: 0; }
}

@keyframes universeAppear {
  0%, 35% { opacity: 0; }
  100% { opacity: 1; }
}

@keyframes starDrift {
  from { transform: translateY(0); }
  to { transform: translateY(-160px); }
}

@keyframes titleAppear {
  to {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}
</style>
</head>

<body>

<main id="menu">
  <h1>DOMAIN EXPANSION</h1>
  <p>CHOOSE YOUR DOMAIN</p>

  <button class="domain online" onclick="openGojo()">
    GOJO — INFINITE VOID · ONLINE
  </button>

  <button class="domain" onclick="showOffline('SUKUNA')">
    SUKUNA — MALEVOLENT SHRINE
  </button>

  <button class="domain" onclick="showOffline('HAKARI')">
    HAKARI — IDLE DEATH GAMBLE
  </button>

  <button class="domain" onclick="showOffline('MEGUMI')">
    MEGUMI — CHIMERA SHADOW GARDEN
  </button>

  <button class="domain" onclick="showOffline('MAHITO')">
    MAHITO — SELF-EMBODIMENT OF PERFECTION
  </button>

  <p id="message" aria-live="polite"></p>
</main>

<section id="gojoPage">
  <h1>GOJO — INFINITE VOID</h1>
  <p>Hold Gojo's crossed-finger sign in front of the camera.</p>

  <video id="camera" autoplay playsinline muted></video>

  <p id="status">Camera is starting...</p>

  <button onclick="backToMenu()">
    BACK TO DOMAINS
  </button>
</section>

<section id="void">
  <div id="universe"></div>
  <div id="stars"></div>

  <div id="energy">
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
  </div>

  <div id="burst"></div>
  <div id="ring"></div>
  <div id="flash"></div>

  <h1 id="voidTitle">
    領域展開
    <br>
    INFINITE VOID
  </h1>

  <button id="close" onclick="closeDomain()">
    CLOSE DOMAIN
  </button>
</section>

<script>
const menu = document.getElementById("menu");
const gojoPage = document.getElementById("gojoPage");
const video = document.getElementById("camera");
const statusText = document.getElementById("status");
const voidScreen = document.getElementById("void");
const message = document.getElementById("message");

let hands = null;
let camera = null;
let active = false;
let matchingFrames = 0;
let lastActivation = 0;
let starting = false;

function showOffline(name) {
  message.textContent =
    name + " DOMAIN IS OFFLINE — COMING SOON!";
}

async function openGojo() {
  if (starting) return;

  starting = true;
  menu.style.display = "none";
  gojoPage.style.display = "block";

  statusText.textContent = "Requesting camera permission...";

  try {
    hands = new Hands({
      locateFile: file =>
        "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults(onHandResults);

    camera = new Camera(video, {
      onFrame: async () => {
        if (hands && video.readyState >= 2) {
          await hands.send({ image: video });
        }
      },
      width: 640,
      height: 480
    });

    await camera.start();

    statusText.textContent =
      "Camera ready — show Gojo's crossed-finger sign.";

  } catch (error) {
    console.error(error);
    statusText.textContent =
      "Camera or hand tracking failed. Check camera permission and reload.";
  } finally {
    starting = false;
  }
}

function distance(a, b) {
  return Math.hypot(
    a.x - b.x,
    a.y - b.y,
    (a.z || 0) - (b.z || 0)
  );
}

function fingerExtended(points, tip, pip) {
  return distance(points[tip], points[0]) >
    distance(points[pip], points[0]) * 1.12;
}

function fingerCurled(points, tip, pip) {
  return distance(points[tip], points[0]) <
    distance(points[pip], points[0]) * 1.08;
}

function isGojoPose(points) {
  const indexExtended = fingerExtended(points, 8, 6);
  const middleCurled = fingerCurled(points, 12, 10);
  const ringCurled = fingerCurled(points, 16, 14);
  const pinkyCurled = fingerCurled(points, 20, 18);

  return (
    indexExtended &&
    middleCurled &&
    ringCurled &&
    pinkyCurled
  );
}

function onHandResults(results) {
  const landmarks = results.multiHandLandmarks;

  if (!landmarks || landmarks.length === 0) {
    matchingFrames = 0;
    statusText.textContent =
      "No hand found — move your hand into view.";
    return;
  }

  const poseMatches = isGojoPose(landmarks[0]);

  if (poseMatches) {
    matchingFrames++;

    statusText.textContent =
      "Possible Gojo pose detected — hold still...";

    if (
      matchingFrames >= 10 &&
      !active &&
      Date.now() - lastActivation > 2500
    ) {
      activateDomain();
    }
  } else {
    matchingFrames = 0;
    statusText.textContent =
      "Hand found, but Gojo's pose does not match yet.";
  }
}

function activateDomain() {
  active = true;
  lastActivation = Date.now();

  voidScreen.style.display = "block";

  /* Restart the animation every activation */
  voidScreen.classList.remove("playing");
  voidScreen.offsetWidth;
  voidScreen.classList.add("playing");
}

function closeDomain() {
  active = false;
  matchingFrames = 0;

  voidScreen.classList.remove("playing");
  voidScreen.style.display = "none";
}

async function backToMenu() {
  closeDomain();

  if (camera) {
    camera.stop();
    camera = null;
  }

  if (hands) {
    await hands.close();
    hands = null;
  }

  video.srcObject = null;

  gojoPage.style.display = "none";
  menu.style.display = "block";

  statusText.textContent = "Camera stopped.";
}

window.addEventListener("pagehide", () => {
  if (camera) camera.stop();
  if (hands) hands.close();
});
</script>

</body>
</html>
